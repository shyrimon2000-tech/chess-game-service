services:
  game-db:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - chess_game_mysql_data:/var/lib/mysql

    networks:
      - chess_game_internal

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - chess_game_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  game-service:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8002:8000"

    depends_on:
      game-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - chess_game_internal

    init: true

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    stop_grace_period: 15s

volumes:
  chess_game_mysql_data:

networks:
  chess_game_internal:
    driver: bridge
